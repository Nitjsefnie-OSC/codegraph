[workspace]
resolver = "2"
members = [
    "crates/codegraph",
    "crates/codegraph-generate",
    "crates/codegraph-core",
    "crates/codegraph-classifier",
    "crates/codegraph-config",
    "crates/codegraph-ext-points",
    "crates/codegraph-grafeo",
    "crates/codegraph-backend",
    "crates/codegraph-naming",
    "crates/codegraph-type-contracts",
    "crates/codegraph-workflow",
    "crates/ast-ifml",
    "gravy-atproto",
    "crates/codegraph-ops",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
thiserror = "2"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rust_decimal = { version = "1", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
tera = { version = "2", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }
codegraph-config = { path = "crates/codegraph-config" }
heck = "0.5"
base64 = "0.22"
garde = "0.20"
utoipa = { version = "6", features = ["uuid", "chrono"] }
sea-orm = { version = "2", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
axum = "0.8"
bytes = "1"
lsp-types = "0.97"
# tree-sitter cannot move past 0.25 until auto-lsp releases > 0.6.2: the
# crate uses `links = "tree-sitter"`, so two versions cannot coexist, and
# auto-lsp 0.6.2 (newest) requires ^0.25.5 and re-exports it through
# `auto_lsp::tree_sitter` (issue #422). auto-lsp master is on 0.26.5 but
# unreleased — coordinate the jump with its next release.
tree-sitter = "0.25"
tree-sitter-language = "0.1"
# salsa: no direct dependency anywhere — 0.22 rides in transitively via
# auto-lsp 0.6.2 (0.23 via rex-driver). A direct salsa upgrade is gated on
# the same auto-lsp release as tree-sitter above (issue #423).
# rex-* @ 40e8510: bumped for the .deploy deployment surface (rexlang #49 —
# parse/lower/validate `.deploy` sources into the versioned
# rex_ir::deploy::DeployModel; targets incl. cloudflareWorkers) on top of
# the DDD Sculptor semantics (rexlang #47) and the IFML module composition
# + deep-navigation grammar (PR #45/#46).
rex-ir = { git = "https://github.com/yestechgroup/rexlang.git", rev = "40e85103e50e80861390696946a56b70a3c425c8" }
rex-driver = { git = "https://github.com/yestechgroup/rexlang.git", rev = "40e85103e50e80861390696946a56b70a3c425c8" }
rex-expr = { git = "https://github.com/yestechgroup/rexlang.git", rev = "40e85103e50e80861390696946a56b70a3c425c8" }
rex-ifml = { git = "https://github.com/yestechgroup/rexlang.git", rev = "40e85103e50e80861390696946a56b70a3c425c8" }
# Sigil (Rune DSL / .rosetta) — issue #255. Pinned by rev like the rexlang
# crates; depended on from `crates/codegraph` ONLY (no sigil deps may leak
# into codegraph-generate / codegraph-core).
sigil-model = { git = "https://github.com/yestechgroup/sigil.git", rev = "49a6a27f589fa89cbb20641504923c911700ee67" }
sigil-resolve = { git = "https://github.com/yestechgroup/sigil.git", rev = "49a6a27f589fa89cbb20641504923c911700ee67" }
sigil-syntax = { git = "https://github.com/yestechgroup/sigil.git", rev = "49a6a27f589fa89cbb20641504923c911700ee67" }
sigil-diag = { git = "https://github.com/yestechgroup/sigil.git", rev = "49a6a27f589fa89cbb20641504923c911700ee67" }
