name: CI

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    env:
      # Debug info dominates the target dir for a full-workspace test
      # build; CI doesn't consume backtraces. Halves disk usage and keeps
      # lld under the runner's disk ceiling (SIGBUS-on-link when ENOSPC).
      RUSTFLAGS: -C debuginfo=0
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest ships ~25 GB of preinstalled tooling the build never
      # touches. `cargo test --workspace` on this workspace produces tens
      # of GB under target/, and an ENOSPC mid-link surfaces as
      # `collect2: fatal error: ld terminated with signal 7 [Bus error]`.
      # Swap is kept: rustc/lld OOM without it shows up as SIGKILL instead.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The mox-plane compile pin (issue #517) cargo-checks the emitted
          # plane on wasm32-unknown-unknown as well as native.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  test-ops-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run ops DB integration tests
        run: cargo test -p codegraph-ops --test db_integration -- --ignored --nocapture
      - name: Run ops generator tests
        run: cargo test -p codegraph --test ops_generator_tests -- --ignored --nocapture
