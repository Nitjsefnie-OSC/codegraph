[package]
name = "codegraph"
version = "0.1.0"
edition.workspace = true

[features]
e2e = []
# Performance instrumentation (issues #469/#472) — strictly opt-in. Flag-off
# builds carry no hotpath code and stay byte-identical.
hotpath = ["dep:hotpath", "hotpath?/hotpath"]
hotpath-alloc = ["hotpath", "hotpath?/hotpath-alloc"]
hotpath-cpu = ["hotpath", "hotpath?/hotpath-cpu"]

[dependencies]
codegraph-generate = { path = "../codegraph-generate" }
codegraph-naming = { path = "../codegraph-naming" }
codegraph-classifier = { path = "../codegraph-classifier" }
codegraph-type-contracts = { path = "../codegraph-type-contracts" }
codegraph-config = { path = "../codegraph-config" }
codegraph-core = { path = "../codegraph-core" }
codegraph-backend = { path = "../codegraph-backend" }
codegraph-ext-points = { path = "../codegraph-ext-points" }
codegraph-ops = { path = "../codegraph-ops" }
# Direct engine access for the artifact export/import + graph cache (issue #275).
codegraph-grafeo = { path = "../codegraph-grafeo" }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tera = { version = "2", features = ["preserve_order"] }
tempfile = "3"
heck = "0.5"
walkdir = "2"
async-trait = "0.1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { workspace = true, features = ["env-filter"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
uuid = { version = "1", features = ["v5"] }
pathdiff = "0.2"
ast-ifml = { path = "../ast-ifml" }
tree-sitter-ifml = { path = "../tree-sitter-ifml" }
tree-sitter-mox = { path = "../tree-sitter-mox" }
tree-sitter-language = { workspace = true }
auto-lsp = { version = "0.6", features = ["lsp_server"] }
syn = "2"
tree-sitter = { workspace = true }
tree-sitter-svelte-next = "0.1.1"
rex-ir = { workspace = true }
rex-driver = { workspace = true }
rex-ifml = { workspace = true }
rex-expr = { workspace = true }
# Sigil (Rune DSL) — issue #255: workspace rev-pins, codegraph-crate-only.
# Provenance for rosetta-derived graph data rides custom_annotations under a
# distinct `origin=rosetta` key (never the mox `source` key).
sigil-model = { workspace = true }
sigil-resolve = { workspace = true }
sigil-syntax = { workspace = true }
sigil-diag = { workspace = true }
# hotpath-rs performance instrumentation (issues #469/#472): wall-clock timing,
# alloc, and CPU-sampling signals behind the `hotpath*` features. No-op when off.
hotpath = { version = "0.28", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
codegraph-grafeo = { path = "../codegraph-grafeo" }
tempfile = "3"
insta = { version = "1", features = ["glob", "yaml"] }
syn = { version = "2", features = ["full", "parsing"] }
proc-macro2 = "1"
