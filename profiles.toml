# hr-graph Profile Configuration
#
# Each profile declares one or more project output sections ([api], [ui],
# [cli]) with generator names and optional post-generation scripts.
#
# Profiles:
#   default    — all artifacts (backward-compatible with pre-profile pipeline)
#   api        — API-only: server, OpenAPI, DB, domain types
#   ui         — UI-only: SvelteKit routes, forms, stores, scaffold
#   cli        — CLI-only: command scaffolding
#   fullstack  — API + UI combined
#   ci         — compile-gate: everything, compile-check only

# ─── default (all artifacts) ─────────────────────────────────────────────────
[profiles.default.meta]
name = "default"
version = "1.0.0"
description = "All artifacts — mirrors the pre-profile pipeline"
authors = ["hr-graph team"]
since = "2026-05-08"

[profiles.default.features]
auth = true
pagination = true
validation_level = "strict"
offline_mode = false
ifml_backend = true
grpc_backend = true
atproto_backend = false
atproto_tenancy = "shared_pds"
atproto_float_policy = "integer_scaled"
ops_backend = true
persistence_provider = "sea_orm"   # "sea_orm" (default) | "cornucopia"
deployment_topology = "monolith"   # "monolith" (default) | "workers"
ifml_design_system = ""            # built-in IFML component pack ("" = none, e.g. "shadcn-svelte")
# Policy-driven RLS from the `.actor` policy graph (issue #219). When true,
# add "policy_rls" to an [api] generators list; emits 020000_policy_rls.sql
# (Postgres only; sqlite is a no-op). Off = byte-identical output.
rls_from_policy = false
# Namespace-aware module layout (issue #268). When true, schemas that
# carry a namespace (from mox `package`, rosetta `namespace`, or JSON
# `$id`/`$namespace` inference) emit under namespace-derived module paths
# (`cdm.base.datetime` → `cdm/base/datetime/...`) for the entity/DTO/db
# module outputs. Default OFF = flat domain layout, byte-identical output.
namespace_layout = false
# Canonical expression IR (issue #278). When true, IFML view guards render
# from the persisted `expr_json` AST via the TypeScript lowering
# (crates/codegraph-generate/src/ifml/expr_ts.rs); conditions outside the
# closed subset are hard errors naming the view. Default OFF =
# byte-identical output.
expr_ir = false
# Public-operations consumer (issue #279). When true, add
# "public_operations_rls" to an [api] generators list; schemas carrying
# `access = Public` (from JSON `x-access: "public"`; mox/rosetta connect
# upstream) whose entity config declares `public_operations` emit
# 021000_public_operations_rls.sql — permissive TO PUBLIC RLS policies —
# and mount routes without permission layers when the ENTIRE operation set
# is public (Postgres only; sqlite is a no-op). Off = byte-identical output.
public_operations_rls = false
# Constraint-plane validations (issue #261). When true, add
# "condition_validations" to an [api] generators list; emits per-domain
# src/domain/<domain>/validations.rs from array minItems/maxItems and the
# rosetta ConditionNode graph family (TODO(#262) transpile markers). Off =
# byte-identical output.
# Same gate also enables "regulatory_reports" (issue #265): add it to an
# [api] generators list to emit per-domain src/domain/<domain>/
# regulatory_reports.rs report skeletons from the rosetta RegulatoryNode
# family (TODO(#263)/TODO(#264) seams). Off = byte-identical output.
# Same gate also enables "functions" (issue #263): add it to an [api]
# generators list to emit per-domain src/domain/<domain>/functions.rs —
# rosetta func elements as Rust free functions (transpiled set/add
# operations, aliases as let-bindings, dispatch heads as match). Pair it
# with function_postconditions = true to emit post-condition
# `debug_assert!` checks (default OFF = absent).
# Same gate also enables "rules" (issue #264): add it to an [api]
# generators list to emit per-domain src/domain/<domain>/rules.rs —
# reporting rules as computed-field functions attached to their input
# entity (transpiled bodies, TODO(#264) markers where untranspilable) and
# eligibility rules as endpoint guards naming the ApiOperations they gate.
rosetta_backend = false
function_postconditions = false
# UX rules plane (issue #293). When true, the built-in ux-default pack
# resolves into ProjectConfig.ux for every template/generator; a project
# --ux-rules file shadows pack rules per selector tier. Off = byte-identical.
ux_rules = true
# IFML test-side auth surface (issue #463). When true the IFML e2e generator
# emits the auth.setup.ts globalSetup (per-persona API keys via
# public.create_api_key), persona fixtures, {view}.auth.spec.ts, journey
# specs, and the extended POM surface. Off = byte-identical.
ifml_e2e_auth = true

[profiles.default.api]
generators = [
    # Entity
    "ddl", "sea_orm_entity", "codelist", "dto", "repository", "command",
    "query", "event", "handler", "workflow_action", "media_route", "test",
    "lifecycle_trait", "domain_types_dto", "domain_types_query_service",
    # Domain ("errors" is required: generated handlers import
    # crate::domain::{domain}::errors::CommonError unconditionally)
    "errors", "router", "links",
    # hurl API contract tests (issue #463) — per-entity contracts + the
    # authn/authz suite, run by the ops api suite
    "hurl_contract",
    # mox operation codegen (issue #501) — presence-gated: emits
    # src/domain/<domain>/mox_ops.rs only when the graph carries mox ops
    "mox_ops",
    # Push-integration plane (issue #503) — presence-gated on the parsed
    # --extension-points config; plan membership is required for profiled
    # runs to emit the catalog/tables/config/dispatcher surface at all
    "integration_tables", "integration_config", "integration_dispatch", "integration_catalog",
    # Global
    "openapi", "scaffold", "basejump_setup", "pgmq_setup",
    "platform_schema", "workflow_seed", "hook_registry", "domain_types_scaffold",
    "report_views",
    "webhook_dispatch", "webhook_endpoint_api",
    # gRPC
    "grpc_proto", "grpc_service", "grpc_router", "grpc_scaffold",
    # AT Protocol (enable with atproto_backend = true)
    # "lexicon", "lexicon_scaffold", "atproto_types", "atproto_client",
    # "atproto_appview", "atproto_xrpc", "atproto_identity",
    # Ops harness
    "ops",
]
output = "review/generated-candidate/"
scripts.post_gen = ["echo post-gen check skipped"]

[profiles.default.ui]
generators = [
    # Entity
    "ui_page", "ui_form", "ui_store", "ui_e2e_test",
    "playwright-entity", "ui_descriptor", "ui-shell",
    # Domain
    "ui-domain-layout",
    # Global
    "ui_scaffold", "ui_types", "ui_codelist", "ui_orgchart", "playwright-global",
    # IFML
    "ifml_skeleton", "ifml_route", "ifml_navigation", "ifml_e2e_test",
]
output = "review/generated-candidate/"
scripts.post_gen = []

[profiles.default.cli]
generators = ["cli_command", "cli_domain", "cli_scaffold"]
output = "review/generated-candidate/"
scripts.post_gen = []


